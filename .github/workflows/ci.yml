name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # provenance_check.py reads the commit history, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Test
        run: python -m pytest --cov=pob --cov-report=term-missing --cov-report=xml

      - name: No test reaches the live feeds
        # Enforced at runtime by the autouse fixture in tests/conftest.py, which
        # blocks urllib.request.urlopen for the whole suite, and proven by the
        # test run below. This replaces an earlier grep over test files for feed
        # hostnames. That grep had both failure modes: it missed a test that
        # reached the feed through the CLI (main(["fetch"]) carries no hostname
        # literal, so it passed in the egress restricted build sandbox and
        # failed on a CI runner with internet), and it false flagged a test that
        # merely asserts the URL constants point at the published hosts. A
        # runtime check has neither.
        run: python -m pytest tests/test_feeds.py -k blocks_outbound_network -q

      - name: House style
        run: |
          python tools/check_dashes.py
          python tools/check_tables.py

      - name: Declared dependencies are all used
        run: python tools/check_dependencies.py

      - name: Published numbers match the measured ones
        run: python tools/check_numbers.py

      - name: The results page matches the metrics
        run: python tools/generate_results_doc.py --check

      - name: Provenance
        if: matrix.python == '3.13'
        run: python scripts/provenance_check.py

  determinism:
    name: the benchmark is reproducible from its seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run the benchmark twice and compare
        # Every published figure is an average over seeds, and the claim that a
        # seed reproduces a corpus is what lets a reader rerun this and get the
        # same answer. Two runs at reduced scale must agree exactly, on the
        # sweep as well as the headline. A generator that picked up entropy
        # from anywhere else would break here rather than in a result nobody
        # can reproduce.
        run: |
          args="--findings 2000 --seeds 3 --sweep 0.25 --sweep-seeds 2 --sweep-findings 2000 --runtime-sizes 2000"
          python benchmark/run_benchmark.py $args --out first.json
          python benchmark/run_benchmark.py $args --out second.json
          python - <<'PY'
          import json, pathlib, sys
          first = json.loads(pathlib.Path("first.json").read_text())
          second = json.loads(pathlib.Path("second.json").read_text())
          scored = ["kev_coverage", "kev_coverage_spread", "window_attainment", "exposure_removed"]
          failures = []
          for name, left in first["headline"]["orderings"].items():
              right = second["headline"]["orderings"][name]
              for key in scored:
                  if left[key] != right[key]:
                      failures.append(f"headline.{name}.{key}: {left[key]} != {right[key]}")
          for key, value in first["headline"]["corpus"].items():
              if second["headline"]["corpus"][key] != value:
                  failures.append(f"corpus.{key}: {value} != {second['headline']['corpus'][key]}")
          rows = zip(first["sensitivity_sweep"]["rows"], second["sensitivity_sweep"]["rows"], strict=True)
          for index, (left, right) in enumerate(rows):
              for key, value in left.items():
                  if right[key] != value:
                      failures.append(f"sweep[{index}].{key}: {value} != {right[key]}")
          if failures:
              print("two runs of the same seeds disagreed:", file=sys.stderr)
              for line in failures:
                  print(" ", line, file=sys.stderr)
              raise SystemExit(1)
          print("both runs agree on every scored field and every sweep row")
          PY
