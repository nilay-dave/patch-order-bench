[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-order-bench"
version = "0.1.0"
description = "Measures how remediation order changes when findings are ranked by exploitation probability instead of severity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["vulnerability-management", "epss", "kev", "cvss", "risk-prioritization", "patch-management", "pci-dss"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
pob = "pob.cli:main"

[project.urls]
Homepage = "https://github.com/__GITHUB_USERNAME__/patch-order-bench"
Documentation = "https://__GITHUB_USERNAME__.github.io/patch-order-bench/"
Issues = "https://github.com/__GITHUB_USERNAME__/patch-order-bench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
